[package]
name = "blog-comments"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
minijinja = { version = "2", features = ["loader"] }
reqwest = { version = "0.13", features = [
    "json",
    "native-tls-vendored",
    "http2",
    "charset",
    "system-proxy",
], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = [
    "postgres",
    "runtime-tokio",
    "chrono",
] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["normalize-path", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
urlencoding = "2"
